name: Scrape Supplement Prices

on:
  schedule:
    # 09:17 UTC is 4:17am Central. Two things about that time are deliberate.
    #
    # The minute: GitHub defers scheduled runs when the queue is busy, and the
    # top of the hour is the busiest minute there is. This job asked for 13:00
    # UTC for two weeks and never once ran before 15:44 -- typically three to
    # five hours late. An odd minute is not a guarantee, but it is the one
    # lever that exists.
    #
    # The hour: even carrying that much delay, 09:17 UTC lands well before the
    # working day here, so a push by hand and this job are no longer reaching
    # for main at the same time. Both of September 14th's collisions were the
    # old schedule arriving mid-afternoon.
    - cron: "17 9 * * *"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

# Two runs at once -- a manual trigger on top of the scheduled one, which is
# how the 14th went -- would race each other for the same file and the same
# branch. Queue them instead. Never cancel a run in progress: it may already
# have committed, and a half-finished scrape is worse than a slow one.
concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required for the bot to push the updated prices
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scrape_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add _data/supplement_prices.json
          git diff --staged --quiet && exit 0
          git commit -m "Update supplement prices [automated]"

          # Catch up before the first push, not only after a rejected one. The
          # scrape takes long enough that main has often moved since checkout,
          # and rebasing here costs nothing while turning the common case from
          # "push, get rejected, retry" into "push".
          git pull --rebase origin main

          # A push by hand while this is mid-run would otherwise fail the job on
          # a non-fast-forward. Rebase and retry rather than lose the scrape.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "could not push after three attempts" >&2
          exit 1
