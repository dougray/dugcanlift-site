name: Scrape Supplement Prices

on:
  schedule:
    # Midnight Central. 05:17 UTC is 00:17 CDT in summer and 23:17 CST the
    # night before in winter, since cron here is fixed UTC and Central is not
    # -- both are the middle of the night, which is the point.
    #
    # The odd minute is deliberate: GitHub defers scheduled runs when the queue
    # is busy, and the top of the hour is the busiest minute there is. This job
    # asked for 13:00 UTC for two weeks and never once ran before 15:44 --
    # typically three to five hours late, which is how a job meant for 8am
    # Central kept arriving mid-afternoon and colliding with someone pushing.
    # An odd minute is not a guarantee against that, but it is the one lever
    # that exists, and starting at midnight means even hours of deferral still
    # finish long before anyone is working.
    - cron: "17 5 * * *"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

# Two runs at once -- a manual trigger on top of the scheduled one, which is
# how the 14th went -- would race each other for the same file and the same
# branch. Queue them instead. Never cancel a run in progress: it may already
# have committed, and a half-finished scrape is worse than a slow one.
concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required for the bot to push the updated prices
    env:
      # Set as repository secrets from a Tailscale OAuth client tagged tag:ci.
      # Mapped into env so the alert steps can test for their presence: an
      # empty value skips the alert, so the bot keeps running without them.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      NTFY_URL: https://mir.tail8ceb8.ts.net/homelab
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow clone. The commit step
          # rebases onto main before pushing, and a depth-1 checkout of any
          # other branch shares no ancestor with main, so that rebase replays
          # the branch's commits as add/add conflicts and fails the job after
          # the scrape has already succeeded. This only bites manual runs on a
          # branch, but that is exactly how a scraper change gets tested.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        id: scrape
        run: python scripts/scrape_prices.py

      - name: Commit updated prices
        id: commit
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add _data/supplement_prices.json
          git diff --staged --quiet && exit 0
          git commit -m "Update supplement prices [automated]"

          # Catch up before the first push, not only after a rejected one. The
          # scrape takes long enough that main has often moved since checkout,
          # and rebasing here costs nothing while turning the common case from
          # "push, get rejected, retry" into "push".
          git pull --rebase origin main

          # A push by hand while this is mid-run would otherwise fail the job on
          # a non-fast-forward. Rebase and retry rather than lose the scrape.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "could not push after three attempts" >&2
          exit 1

      # ---- alerting ---------------------------------------------------------
      # ntfy lives on mir and is reachable only over the tailnet, so the runner
      # joins as an ephemeral tag:ci node just long enough to post. Runs after
      # everything else, even when a step failed, and only speaks up when
      # something is wrong: a row without a price, a scraper crash, or a push
      # that did not land.
      - name: Join the tailnet
        if: always() && env.TS_OAUTH_CLIENT_ID != '' && (steps.scrape.outcome != 'success' || steps.commit.outcome != 'success' || steps.scrape.outputs.unpriced != '0')
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Alert via ntfy
        if: always() && env.TS_OAUTH_CLIENT_ID != '' && (steps.scrape.outcome != 'success' || steps.commit.outcome != 'success' || steps.scrape.outputs.unpriced != '0')
        env:
          SCRAPE: ${{ steps.scrape.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          TOTAL: ${{ steps.scrape.outputs.total }}
          UNPRICED: ${{ steps.scrape.outputs.unpriced }}
          NAMES: ${{ steps.scrape.outputs.unpriced_names }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCRAPE" != "success" ]; then
            title="Price bot: scraper crashed"; body="Run: $RUN_URL"; prio=high; tags=rotating_light
          elif [ "$COMMIT" != "success" ]; then
            title="Price bot: could not push prices"; body="Scraped ${UNPRICED:-?} unpriced of ${TOTAL:-?}. Run: $RUN_URL"; prio=high; tags=rotating_light
          else
            title="Price bot: $UNPRICED of $TOTAL unpriced"; body="$NAMES"; prio=default; tags=warning
          fi
          curl -sS --fail --max-time 30 \
            -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" -H "Click: $RUN_URL" \
            -d "$body" "$NTFY_URL"
